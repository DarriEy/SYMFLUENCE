# ================================================================================
# Bow at Banff — PCR-GLOBWB distributed 5-arcmin calibration
# 7-year run with 1yr warmup, 3yr calibration, 3yr evaluation
# ================================================================================

# Experiment metadata
EXPERIMENT_ID: pcrglobwb_bow_5min_cal
DOMAIN_NAME: Bow_at_Banff_lumped_calibration_ensemble

# Domain definition
DOMAIN_DEFINITION_METHOD: lumped
SUB_GRID_DISCRETIZATION: GRUs
POUR_POINT_COORDS: 51.1722/-115.5717
BOUNDING_BOX_COORDS: 51.76/-116.55/50.95/-115.5

# Time period (7 years: 1yr warmup + 3yr cal + 3yr eval)
EXPERIMENT_TIME_START: '2002-01-01 01:00'
EXPERIMENT_TIME_END: '2008-12-31 23:00'

# Forcing
FORCING_DATASET: RDRS
FORCING_TIME_STEP_SIZE: 3600

# Observations
STATION_ID: '05BB001'
STREAMFLOW_DATA_PROVIDER: WSC

# Model — 5 arcmin distributed
HYDROLOGICAL_MODEL: PCRGLOBWB
PCRGLOBWB_SPATIAL_MODE: distributed
PCRGLOBWB_RESOLUTION: '05min'
PCRGLOBWB_PET_METHOD: hamon
PCRGLOBWB_TIMEOUT: 1800

# Calibration — DDS with cal/eval split
OPTIMIZATION_METHODS: ['iteration']
OPTIMIZATION_ALGORITHM: DDS
OPTIMIZATION_MAX_ITERATIONS: 50
OPTIMIZATION_METRIC: KGE
CALIBRATION_PERIOD: '2003-01-01,2005-12-31'
EVALUATION_PERIOD: '2006-01-01,2008-12-31'
NUM_PROCESSES: 1

# Paths
SYMFLUENCE_DATA_DIR: /Users/darri.eythorsson/compHydro/SYMFLUENCE_data
SYMFLUENCE_CODE_DIR: /Users/darri.eythorsson/compHydro/SYMFLUENCE

# Misc
LOG_LEVEL: INFO
FORCE_RUN_ALL_STEPS: false
