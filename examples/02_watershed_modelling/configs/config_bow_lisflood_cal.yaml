# ================================================================================
# Bow at Banff — LISFLOOD DDS calibration (200 iterations)
# Uses existing calibration ensemble forcing (RDRS hourly, 2005-2006)
# ================================================================================

# Experiment metadata
EXPERIMENT_ID: lisflood_cal_dds
DOMAIN_NAME: Bow_at_Banff_lumped_calibration_ensemble

# Domain definition
DOMAIN_DEFINITION_METHOD: lumped
SUB_GRID_DISCRETIZATION: GRUs
POUR_POINT_COORDS: 51.1722/-115.5717
BOUNDING_BOX_COORDS: 51.76/-116.55/50.95/-115.5

# Time period — full 4 years: 1yr spinup, 2yr cal, 1yr eval
EXPERIMENT_TIME_START: '2005-01-01 01:00'
EXPERIMENT_TIME_END: '2008-12-31 23:00'
CALIBRATION_PERIOD: '2006-01-01, 2007-12-31'
EVALUATION_PERIOD: '2008-01-01, 2008-12-31'
SPINUP_PERIOD: '2005-01-01, 2005-12-31'

# Forcing
FORCING_DATASET: RDRS
FORCING_TIME_STEP_SIZE: 3600

# Observations
STATION_ID: '05BB001'
STREAMFLOW_DATA_PROVIDER: WSC

# Model
HYDROLOGICAL_MODEL: LISFLOOD
LISFLOOD_SPATIAL_MODE: lumped
LISFLOOD_PET_METHOD: oudin
LISFLOOD_FORCING_TIMESTEP: 86400
LISFLOOD_PARAMS_TO_CALIBRATE: UpperZoneTimeConstant,LowerZoneTimeConstant,GwPercValue,b_Xinanjiang,PowerPrefFlow,CalChanMan,SnowMeltCoef,CalEvaporation

# Optimization
OPTIMIZATION_METHODS: ['iteration']
ITERATIVE_OPTIMIZATION_ALGORITHM: DDS
OPTIMIZATION_METRIC: KGE
OPTIMIZATION_TARGET: streamflow
NUMBER_OF_ITERATIONS: 200
DDS_R: 0.2

# Paths
SYMFLUENCE_DATA_DIR: /Users/darri.eythorsson/compHydro/SYMFLUENCE_data
SYMFLUENCE_CODE_DIR: /Users/darri.eythorsson/compHydro/SYMFLUENCE

# Misc
LOG_LEVEL: INFO
FORCE_RUN_ALL_STEPS: false
