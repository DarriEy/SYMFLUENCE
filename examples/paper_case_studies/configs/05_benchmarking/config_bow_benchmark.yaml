# Experiment 5: Benchmarking (Section 4.2.2, Fig. 8)
# Evaluates model ensemble against persistence, climatology, and statistical benchmarks
# Produces Figure 8: benchmark comparison

system:
  # Steps this experiment runs (self-scoping; see `symfluence workflow list-steps`)
  workflow_steps:
  - setup_project
  - create_pour_point
  - acquire_attributes
  - define_domain
  - discretize_domain
  - process_observed_data
  - acquire_forcings
  - model_agnostic_preprocessing
  - build_model_ready_store
  - run_benchmarking
  data_dir: ./data/
  code_dir: ./
domain:
  name: Bow_at_Banff_lumped_era5
  experiment_id: benchmark
  time_start: 2002-01-01 01:00
  time_end: 2009-12-31 23:00
  calibration_period: 2004-01-01, 2007-12-31
  evaluation_period: 2008-01-01, 2009-12-31
  spinup_period: 2002-01-01, 2003-12-31
  pour_point_coords: 51.1722/-115.5717
  bounding_box_coords: 51.76/-116.55/50.95/-115.5
  definition_method: lumped
  delineation:
    routing: lumped
  discretization: GRUs
data:
  streamflow_data_provider: WSC
forcing:
  dataset: ERA5
model:
  hydrological_model: SUMMA
  routing_model: none
optimization:
  methods:
  - iteration
  algorithm: DDS
  iterations: 1000
  metric: KGE
evaluation:
  streamflow:
    station_id: 05BB001
  analyses:
  - benchmarking
