# FUSE - Multi-Model Ensemble (Section 4.2.1, Fig. 7)
# Framework for Understanding Structural Errors

system:
  # Steps this experiment runs (self-scoping; see `symfluence workflow list-steps`)
  workflow_steps:
  - setup_project
  - create_pour_point
  - acquire_attributes
  - define_domain
  - discretize_domain
  - process_observed_data
  - acquire_forcings
  - model_agnostic_preprocessing
  - build_model_ready_store
  - model_specific_preprocessing
  - run_model
  - calibrate_model
  data_dir: default
  code_dir: default
  random_seed: 42   # pin DDS seed to the paper value for reproducibility (Fig 7)
domain:
  name: Bow_at_Banff_lumped_era5
  pour_point_coords: 51.1722/-115.5717
  bounding_box_coords: 51.76/-116.55/50.95/-115.5
  definition_method: lumped
  delineation:
    routing: lumped
    geofabric_type: TDX
    stream_threshold: 5000
  time_start: 2002-01-01 01:00
  time_end: 2009-12-31 23:00
  calibration_period: 2004-01-01, 2007-12-31
  evaluation_period: 2008-01-01, 2009-12-31
  spinup_period: 2002-01-01, 2003-12-31
  discretization: GRUs
  experiment_id: run_1
data:
  streamflow_data_provider: WSC
forcing:
  dataset: ERA5
  time_step_size: 3600
model:
  hydrological_model: FUSE
  routing_model: none
  fuse:
    spatial_mode: lumped
    run_internal_calibration: false   # calibrate externally via DDS only; disable FUSE-native SCE (code default is true)
    params_to_calibrate: MAXWATR_1,MAXWATR_2,BASERTE,QB_POWR,TIMEDELAY,PERCRTE,FRACTEN,RTFRAC1,MBASE,MFMAX,MFMIN,PXTEMP,LAPSE
    # Frozen-run search space (FUSE_PARAM_BOUNDS): FUSE-native constraint-file bounds.
    # The registry defaults exclude the Fig. 7 optimum on 8 of 13 parameters
    # (BASERTE 521 vs cap 1, PERCRTE 497 vs cap 100, LAPSE -5.7 vs [3,10], PXTEMP 3.9
    # vs [-2,2]; MBASE/MFMAX/MFMIN shadowed by Snow-17 entries), capping DDS at
    # KGE ~0.68. These wide bounds are part of the experiment definition.
    param_bounds:
      MAXWATR_1: [25.0, 1000.0]
      MAXWATR_2: [50.0, 5000.0]
      BASERTE: [0.001, 1000.0]
      QB_POWR: [1.0, 10.0]
      TIMEDELAY: [0.01, 5.0]
      PERCRTE: [0.1, 1000.0]
      FRACTEN: [0.05, 0.95]
      RTFRAC1: [0.05, 0.95]
      MBASE: [0.0, 3.0]
      MFMAX: [2.0, 8.0]
      MFMIN: [0.4, 6.0]
      PXTEMP: [-1.0, 5.0]
      LAPSE: [-7.0, -4.0]
optimization:
  methods:
  - iteration
  algorithm: DDS
  iterations: 6000
  metric: KGE
evaluation:
  streamflow:
    station_id: 05BB001
