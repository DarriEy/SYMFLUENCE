# Experiment 1: Lumped + distributed routing - Bow River at Banff
# Bow lumped GRU + semi-distributed routing network (Section 2.1, Fig. 2i, Table 1)
# 1 GRU, 1 HRU, 49 segments — hybrid: lumped hydrology, distributed routing
# Demonstrates decoupling of hydrological response units from routing network

system:
  # Steps this experiment runs (self-scoping; see `symfluence workflow list-steps`)
  workflow_steps:
  - setup_project
  - create_pour_point
  - acquire_attributes
  - define_domain
  - discretize_domain
  data_dir: default
  code_dir: default
domain:
  name: Bow_at_Banff_lumped_sd_routing
  definition_method: lumped
  pour_point_coords: 51.1722/-115.5717
  bounding_box_coords: 51.76/-116.55/50.95/-115.5
  dem_source: copdem90
  delineation:
    # river_network triggers delineation of the routing network alongside the
    # single lumped GRU; stream_threshold 3400 on the 90 m DEM gives 49 segments.
    routing: river_network
    stream_threshold: 3400
  time_start: 2002-01-01 01:00
  time_end: 2009-12-31 23:00
  calibration_period: 2004-01-01, 2007-12-31
  evaluation_period: 2008-01-01, 2009-12-31
  spinup_period: 2002-01-01, 2003-12-31
  discretization: GRUs
  experiment_id: Bow_at_Banff_lumped_sd_routing
forcing:
  dataset: ERA5
model:
  hydrological_model: SUMMA
  routing_model: mizuRoute
