# Experiment 1d: Regional distributed domain - Iceland
# Iceland regional river-basin GRUs (Section 2.1, Fig. 3a, Table 1)
# Tests: Large-scale distributed domain definition

system:
  # Steps this experiment runs (self-scoping; see `symfluence workflow list-steps`)
  workflow_steps:
  - setup_project
  - create_pour_point
  - acquire_attributes
  - define_domain
  - discretize_domain
  data_dir: default
  code_dir: default
domain:
  name: Iceland_regional
  definition_method: semidistributed
  # Delineated with TauDEM from the Copernicus 90 m DEM. Threshold 1667 cells
  # = 13.5 km2, the same contributing area as the paper-run recipe (30 m DEM,
  # 15000 cells); 90 m keeps the national delineation tractable on a laptop.
  dem_source: copdem90
  delineation:
    routing: distributed
    method: stream_threshold
    stream_threshold: 1667
    delineate_by_pourpoint: false
    delineate_coastal_watersheds: false
  time_start: 2000-01-01 01:00
  time_end: 2008-12-31 23:00
  discretization: GRUs
  experiment_id: Iceland_regional
  bounding_box_coords: 66.6/-24.6/63.2/-13.2
  pour_point_coords: 63.93/-21.03
forcing:
  dataset: ERA5
model:
  hydrological_model: FUSE
  routing_model: mizuRoute
