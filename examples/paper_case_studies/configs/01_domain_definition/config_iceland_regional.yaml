# Experiment 1d: Regional distributed domain - Iceland
# Iceland regional, 6,606 river-basin GRUs (Section 2.1, Fig. 3a, Table 1)
# Tests: Large-scale distributed domain with CARRA reanalysis forcing

system:
  # Steps this experiment runs (self-scoping; see `symfluence workflow list-steps`)
  workflow_steps:
  - setup_project
  - create_pour_point
  - acquire_attributes
  - define_domain
  - discretize_domain
  data_dir: default
  code_dir: default
domain:
  name: Iceland_regional
  definition_method: semidistributed
  # Delineated with TauDEM from the Copernicus 30 m DEM, threshold 15000
  # (the Iceland_multivar paper-run recipe; maintainer-adjudicated 2026-07-11)
  dem_source: copernicus
  delineation:
    routing: distributed
    method: stream_threshold
    stream_threshold: 15000
    delineate_by_pourpoint: false
    delineate_coastal_watersheds: false
  time_start: 2000-01-01 01:00
  time_end: 2008-12-31 23:00
  discretization: GRUs
  experiment_id: Iceland_regional
  bounding_box_coords: 66.6/-24.6/63.2/-13.2
  pour_point_coords: 63.93/-21.03
forcing:
  dataset: CARRA
model:
  hydrological_model: FUSE
  routing_model: mizuRoute
