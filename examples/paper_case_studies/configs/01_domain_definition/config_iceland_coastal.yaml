# Experiment 1: Iceland + coastal watersheds - semi-distributed
# Iceland + coastal GRUs (Section 2.1, Fig. 3b, Table 1)
# 7618 GRUs (6606 river basin + 1012 coastal), 7618 HRUs, 6606 segments
# Adds coastal drainage areas for complete spatial coverage of Iceland

system:
  # Steps this experiment runs (self-scoping; see `symfluence workflow list-steps`)
  workflow_steps:
  - setup_project
  - create_pour_point
  - acquire_attributes
  - define_domain
  - discretize_domain
  data_dir: default
  code_dir: default
domain:
  name: Iceland_coastal
  definition_method: semidistributed
  bounding_box_coords: 66.6/-24.6/63.2/-13.2
  # Delineated with TauDEM from the Copernicus 90 m DEM (the actual paper
  # run: SUBSET_FROM_GEOFABRIC false, DEM_SOURCE copdem90, threshold 5000)
  dem_source: copdem90
  delineation:
    routing: distributed
    method: stream_threshold
    stream_threshold: 5000
    delineate_by_pourpoint: false
    delineate_coastal_watersheds: true
  time_start: 2000-01-01 03:00
  time_end: 2008-12-31 21:00
  discretization: GRUs
  experiment_id: Iceland_coastal
forcing:
  dataset: CARRA
model:
  hydrological_model: FUSE
  routing_model: mizuRoute
  fuse:
    spatial_mode: distributed
