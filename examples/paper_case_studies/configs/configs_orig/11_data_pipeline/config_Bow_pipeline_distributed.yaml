# =============================================================================
# SYMFLUENCE Data Processing Pipeline - Distributed Discretization Comparison
# =============================================================================
# Identical to the lumped configuration except for spatial discretization.
# Used to benchmark pipeline scaling with increased HRU count.
# =============================================================================

# --- Section 1: Global settings ---
SYMFLUENCE_DATA_DIR: "/Users/darrieythorsson/compHydro/code/SYMFLUENCE_data/"
SYMFLUENCE_CODE_DIR: "/Users/darrieythorsson/compHydro/code/SYMFLUENCE"
DOMAIN_NAME: Bow_at_Banff_pipeline_distributed
EXPERIMENT_ID: pipeline_distributed
EXPERIMENT_TIME_START: 2002-01-01 01:00
EXPERIMENT_TIME_END: 2009-12-31 23:00
CALIBRATION_PERIOD: 2004-01-01, 2007-12-31
EVALUATION_PERIOD: 2008-01-01, 2009-12-31
SPINUP_PERIOD: 2002-01-01, 2003-12-31
MPI_PROCESSES: 1
FORCE_RUN_ALL_STEPS: False

# --- Section 2: Geospatial settings ---
POUR_POINT_SHP_PATH: default
POUR_POINT_COORDS: 51.1722/-115.5717
BOUNDING_BOX_COORDS: 51.76/-116.55/50.95/-115.5   # Bow-at-Banff extent for DEM acquisition
DOMAIN_DEFINITION_METHOD: semidistributed   # TauDEM sub-basin delineation (not a TDX subset)
STREAM_THRESHOLD: 3400                       # 90 m DEM + 3400 cells -> 49 GRUs / 49 segments
BOUNDING_BOX_BUFFER: 0.1

# Semi-distributed discretization (49 GRUs with elevation bands)
SUB_GRID_DISCRETIZATION: elevation
CATCHMENT_SHP_PATH: default
RIVER_NETWORK_SHP_PATH: default
ELEVATION_BAND_SIZE: 200  # metres
MIN_HRU_SIZE: 4.0         # km²

# DEM and geospatial attributes
DEM_SOURCE: copdem90   # Copernicus GLO-90 (90 m) reproduces the paper's domain delineation ('copernicus' = 30 m; 'merit_hydro' needs DATA_ACCESS: hpc).
DEM_PATH: default
SOIL_CLASS_PATH: default
LAND_CLASS_PATH: default

# --- Section 3: Model-agnostic data settings ---
FORCING_DATASET: ERA5
FORCING_VARIABLES:
  - air_temperature
  - precipitation_flux
  - surface_downwelling_shortwave_flux
  - surface_downwelling_longwave_flux
  - specific_humidity
  - wind_speed
  - surface_air_pressure

FORCING_SPATIAL_REMAPPING: EASYMORE
TEMPERATURE_LAPSE_RATE: default
PRECIPITATION_LAPSE_RATE: none
INTERSECTION_DEM_PATH: default

# --- Section 4: Model-specific settings ---
HYDROLOGICAL_MODEL: SUMMA
MODEL_EXE: default
ROUTING_MODEL: mizuRoute
ROUTING_EXE: default

# --- Section 5: Evaluation settings ---
STREAMFLOW_RAW_PATH: default
STREAMFLOW_PROVIDER: WSC
STREAMFLOW_STATION_ID: 05BB001
SNOW_OBS_SOURCE: SNOTEL
SNOW_MODIS_PRODUCT: MOD10A1
ET_OBS_SOURCE: MODIS
ET_MODIS_PRODUCT: MOD16A2
GRACE_OBS_SOURCE: GRACE
GRACE_PROCESSING: mascon
SOIL_MOISTURE_SOURCE: ERA5_LAND

# --- Section 6: Pipeline profiling ---
PIPELINE_PROFILING: True
PROFILE_OUTPUT_DIR: default
LOG_DATA_VOLUMES: True
BENCHMARK_REMAPPING: True
