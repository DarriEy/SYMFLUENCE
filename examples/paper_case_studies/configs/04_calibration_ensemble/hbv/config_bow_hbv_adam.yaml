# HBV x ADAM - Calibration Algorithm Comparison (Section 4.2.3, Fig. 9)
system:
  # Steps this experiment runs (self-scoping; see `symfluence workflow list-steps`)
  workflow_steps:
  - setup_project
  - create_pour_point
  - acquire_attributes
  - define_domain
  - discretize_domain
  - process_observed_data
  - acquire_forcings
  - model_agnostic_preprocessing
  - build_model_ready_store
  - model_specific_preprocessing
  - run_model
  - calibrate_model
  data_dir: default
  code_dir: default
  num_processes: 1
  force_run_all_steps: false
  random_seed: 42
domain:
  name: Bow_at_Banff_lumped_calibration_ensemble
  pour_point_coords: 51.1722/-115.5717
  bounding_box_coords: 51.76/-116.55/50.95/-115.5
  definition_method: lumped
  discretization: GRUs
  delineation:
    routing: lumped
    geofabric_type: TDX
    stream_threshold: 10000
    lumped_watershed_method: TauDEM
  time_start: 2002-01-01 01:00
  time_end: 2009-12-31 23:00
  calibration_period: 2004-01-01, 2007-12-31
  evaluation_period: 2008-01-01, 2009-12-31
  spinup_period: 2002-01-01, 2003-12-31
  experiment_id: cal_ensemble_hbv_adam
data:
  streamflow_data_provider: WSC
forcing:
  dataset: RDRS
  variables: default
  measurement_height: 2
  time_step_size: 3600
model:
  hydrological_model: HBV
  routing_model: none
  hbv:
    backend: jax
    timestep_hours: 24
    warmup_days: 730
optimization:
  methods:
  - iteration
  metric: KGE
  gradient_mode: finite_difference
  algorithm: ADAM
  iterations: 500
  skip_warm_start: true
  adam:
    lr: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
evaluation:
  streamflow:
    station_id: 05BB001
    download_wsc: true
