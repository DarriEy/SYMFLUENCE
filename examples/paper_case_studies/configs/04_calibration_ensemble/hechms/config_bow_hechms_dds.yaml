# HECHMS x DDS - Calibration Algorithm Comparison (Section 4.2.3, Fig. 9)
system:
  # Steps this experiment runs (self-scoping; see `symfluence workflow list-steps`)
  workflow_steps:
  - setup_project
  - create_pour_point
  - acquire_attributes
  - define_domain
  - discretize_domain
  - process_observed_data
  - acquire_forcings
  - model_agnostic_preprocessing
  - build_model_ready_store
  - model_specific_preprocessing
  - run_model
  - calibrate_model
  data_dir: default
  code_dir: default
  num_processes: 1
  force_run_all_steps: false
  random_seed: 42
domain:
  name: Bow_at_Banff_lumped_calibration_ensemble
  pour_point_coords: 51.1722/-115.5717
  bounding_box_coords: 51.76/-116.55/50.95/-115.5
  definition_method: lumped
  discretization: GRUs
  delineation:
    routing: lumped
    geofabric_type: TDX
    stream_threshold: 10000
    lumped_watershed_method: TauDEM
  time_start: 2002-01-01 01:00
  time_end: 2009-12-31 23:00
  calibration_period: 2004-01-01, 2007-12-31
  evaluation_period: 2008-01-01, 2009-12-31
  spinup_period: 2002-01-01, 2003-12-31
  experiment_id: cal_ensemble_hechms_dds
data:
  streamflow_data_provider: WSC
forcing:
  dataset: RDRS
  variables: default
  measurement_height: 2
  time_step_size: 3600
model:
  hydrological_model: HECHMS
  routing_model: none
  hechms:
    backend: jax
    warmup_days: 730
optimization:
  methods:
  - iteration
  metric: KGE
  algorithm: DDS
  iterations: 1000
  dds:
    r: 0.2
  skip_warm_start: true
evaluation:
  streamflow:
    station_id: 05BB001
    download_wsc: true
# Flat passthrough key: read via config.get() by the jHECHMS parameter manager (no typed nested field).
_extra:
  HECHMS_INITIAL_PARAMS: px_temp=1.0,base_temp=0.0,ati_meltrate_coeff=1.0,meltrate_max=6.0,meltrate_min=1.5,cold_limit=25.0,ati_cold_rate_coeff=0.15,water_capacity=0.15,cn=64.0,initial_abstraction_ratio=0.175,tc=10.25,r_coeff=10.25,gw_storage_coeff=50.5,deep_perc_fraction=0.25

# Pinned for reproducibility and to prevent the 'auto' fallback cascade
# (OPeNDAP fail -> tiled fail -> full-domain daily files, ~720 MB/day).
RDRS_ACQUISITION_METHOD: tiled
