# Data Pipeline - Paradise Creek point-scale (Section 2.2, Fig. 4)
# Demonstrates automated data acquisition and preprocessing

system:
  # Steps this experiment runs (self-scoping; see `symfluence workflow list-steps`)
  workflow_steps:
  - setup_project
  - create_pour_point
  - acquire_attributes
  - define_domain
  - discretize_domain
  - process_observed_data
  - acquire_forcings
  - model_agnostic_preprocessing
  - build_model_ready_store
  data_dir: ./data/
  code_dir: ./
domain:
  name: paradise_snotel_wa
  experiment_id: pipeline_paradise
  time_start: 2015-01-01 01:00
  time_end: 2020-12-31 23:00
  pour_point_coords: 46.78/-121.75
  definition_method: point
  delineation:
    routing: lumped
  data_access: cloud
  dem_source: copernicus
  discretization: GRUs
forcing:
  dataset: ERA5
  time_step_size: 3600
model:
  hydrological_model: SUMMA
  routing_model: none
