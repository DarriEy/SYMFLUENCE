# Iceland National Water Model — SUMMA + mizuRoute
#
# Semi-distributed setup across all of Iceland using TauDEM delineation
# with elevation-band HRUs, ERA5 forcing, and LamaH-ICE observations.
# Glacier mode enabled for Vatnajökull, Langjökull, Hofsjökull, etc.

# ── System ──────────────────────────────────────────────────────────
SYMFLUENCE_DATA_DIR: default
SYMFLUENCE_CODE_DIR: default
MPI_PROCESSES: 1
FORCE_RUN_ALL_STEPS: false
LOG_LEVEL: INFO
LOG_TO_FILE: true
LOG_FORMAT: detailed

# ── Domain identification ───────────────────────────────────────────
DOMAIN_NAME: Iceland_National
EXPERIMENT_ID: iceland_summa_v1

# ── Temporal extent ─────────────────────────────────────────────────
# 10-year run: 2 years spinup, 5 years calibration, 3 years evaluation
EXPERIMENT_TIME_START: 2001-01-01 01:00
EXPERIMENT_TIME_END:   2010-12-31 23:00
SPINUP_PERIOD:         2001-01-01, 2002-12-31
CALIBRATION_PERIOD:    2003-01-01 01:00, 2007-12-31 23:00
EVALUATION_PERIOD:     2008-01-01 01:00, 2010-12-31 23:00

# ── Spatial domain ──────────────────────────────────────────────────
# Full Iceland bounding box
BOUNDING_BOX_COORDS: 66.6/-24.6/63.2/-13.2
POUR_POINT_COORDS: 64.5/-18.5

# Semi-distributed: TauDEM delineation into sub-catchments
DOMAIN_DEFINITION_METHOD: delineate
ROUTING_DELINEATION: distributed
GEOFABRIC_TYPE: na
DELINEATION_METHOD: stream_threshold
STREAM_THRESHOLD: 5000
LUMPED_WATERSHED_METHOD: TauDEM

# Critical for an island — capture coastal draining basins
DELINEATE_COASTAL_WATERSHEDS: true
DELINEATE_BY_POURPOINT: false
MOVE_OUTLETS_MAX_DISTANCE: 200
CLEANUP_INTERMEDIATE_FILES: false

# ── Sub-grid discretization ────────────────────────────────────────
# Elevation bands capture glacier/snow dynamics; aspect matters at 65°N
DOMAIN_DISCRETIZATION: GRUs
SUB_GRID_DISCRETIZATION: elevation
ELEVATION_BAND_SIZE: 200
MIN_HRU_SIZE: 4
MIN_GRU_SIZE: 0
RADIATION_CLASS_NUMBER: 5
ASPECT_CLASS_NUMBER: 8

# ── DEM & land surface data ────────────────────────────────────────
DATA_ACCESS: cloud
DEM_SOURCE: copdem90
SOILGRIDS_LAYER: wrb_0-5cm_mode

# ── Forcing ─────────────────────────────────────────────────────────
FORCING_DATASET: ERA5
FORCING_VARIABLES: default
FORCING_MEASUREMENT_HEIGHT: 2
FORCING_TIME_STEP_SIZE: 3600
APPLY_LAPSE_RATE: true
LAPSE_RATE: 0.0065
PET_METHOD: oudin
SUPPLEMENT_FORCING: false

# ── Observations — LamaH-ICE ───────────────────────────────────────
# 111 gauged basins across Iceland (Helgason & Nijssen, ESSD 2024)
# Auto-downloads from HydroShare if not present locally
EVALUATION_DATA:
  - streamflow
STREAMFLOW_DATA_PROVIDER: LAMAH_ICE
LAMAH_ICE_DOMAIN_ID: 105
LAMAH_ICE_PATH: default

# ── Model: SUMMA ────────────────────────────────────────────────────
HYDROLOGICAL_MODEL: SUMMA
SUMMA_EXE: summa_sundials.exe
SETTINGS_SUMMA_CONNECT_HRUS: true

# Parallel execution (adjust GRU counts after delineation)
SETTINGS_SUMMA_USE_PARALLEL_SUMMA: false
SETTINGS_SUMMA_GRU_COUNT: 200
SETTINGS_SUMMA_GRU_PER_JOB: 10
SETTINGS_SUMMA_CPUS_PER_TASK: 32
SETTINGS_SUMMA_TIME_LIMIT: 02:00:00
SETTINGS_SUMMA_MEM: 5

# Glacier mode — Iceland has ~11% glacial coverage
SETTINGS_SUMMA_GLACIER_MODE: true

# Calibration parameters — snow/soil/routing
PARAMS_TO_CALIBRATE: tempCritRain,k_soil,vGn_n,theta_sat,frozenPrecipMultip,Fcapil,k_macropore
BASIN_PARAMS_TO_CALIBRATE: routingGammaScale,routingGammaShape

# SUMMA decisions — cold-region & glacier-appropriate physics
SUMMA_DECISION_OPTIONS:
  # Snow processes
  snowIncept:
    - lightSnow
  compaction:
    - anderson
  snowLayers:
    - CLM_2010
  alb_method:
    - conDecay
  thCondSnow:
    - smnv2000
    - jrdn1991
  # Vegetation
  vegeParTbl:
    - MODIFIED_IGBP_MODIS_NOAH
  soilStress:
    - NoahType
  stomResist:
    - BallBerry
  LAI_method:
    - monTable
  veg_traits:
    - Raupach_BLM1994
  canopyEmis:
    - difTrans
  windPrfile:
    - logBelowCanopy
  canopySrad:
    - BeersLaw
  # Soil
  soilCatTbl:
    - ROSETTA
  f_Richards:
    - mixdform
  groundwatr:
    - bigBuckt
  hc_profile:
    - constant
  bcLowrSoiH:
    - drainage
  thCondSoil:
    - funcSoilWet
  spatial_gw:
    - localColumn
  # Routing
  subRouting:
    - timeDlay
  # Numerics
  num_method:
    - itertive
  fDerivMeth:
    - analytic
  bcUpprTdyn:
    - nrg_flux
  bcLowrTdyn:
    - zeroFlux
  bcUpprSoiH:
    - liq_flux
  astability:
    - louisinv

# ── Routing: mizuRoute ──────────────────────────────────────────────
ROUTING_MODEL: mizuRoute
INSTALL_PATH_MIZUROUTE: default
EXE_NAME_MIZUROUTE: mizuRoute.exe
SETTINGS_MIZU_ROUTING_DT: 3600
SETTINGS_MIZU_ROUTING_UNITS: m/s
SETTINGS_MIZU_ROUTING_VAR: averageRoutedRunoff
SETTINGS_MIZU_OUTPUT_FREQ: single
SETTINGS_MIZU_OUTPUT_VARS: 1
SETTINGS_MIZU_NEEDS_REMAP: false

# ── Optimization ────────────────────────────────────────────────────
OPTIMIZATION_METHODS:
  - iteration
OPTIMIZATION_TARGET: streamflow
CALIBRATION_TIMESTEP: daily
ITERATIVE_OPTIMIZATION_ALGORITHM: DDS
NUMBER_OF_ITERATIONS: 200
DDS_R: 0.2
OPTIMIZATION_METRIC: KGE

# ── Shapefile field mappings ────────────────────────────────────────
CATCHMENT_SHP_LAT: center_lat
CATCHMENT_SHP_LON: center_lon
CATCHMENT_SHP_AREA: HRU_area
CATCHMENT_SHP_HRUID: HRU_ID
CATCHMENT_SHP_GRUID: GRU_ID
RIVER_BASIN_SHP_RM_GRUID: GRU_ID
RIVER_BASIN_SHP_HRU_TO_SEG: gru_to_seg
RIVER_BASIN_SHP_AREA: GRU_area
RIVER_NETWORK_SHP_LENGTH: Length
RIVER_NETWORK_SHP_SEGID: LINKNO
RIVER_NETWORK_SHP_DOWNSEGID: DSLINKNO
RIVER_NETWORK_SHP_SLOPE: Slope
