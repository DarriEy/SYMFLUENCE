name: CLA Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  cla-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Check CLA signature
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Repository owner and bots are exempt
            const exemptUsers = ['DarriEy', 'dependabot[bot]', 'github-actions[bot]'];
            if (exemptUsers.includes(author)) {
              console.log(`${author} is exempt from CLA.`);
              return;
            }

            // Check CLA_SIGNATURES file
            let signed = false;
            try {
              const signatures = fs.readFileSync('CLA_SIGNATURES', 'utf8');
              const lines = signatures.split('\n');
              for (const line of lines) {
                // Individual CLA: "GitHub: username"
                // Org signatory: "GitHub Username of Signatory: <username>"
                if (line.startsWith('GitHub')) {
                  const gh = line.split(':').slice(1).join(':').trim().replace(/^<|>$/g, '');
                  if (gh.toLowerCase() === author.toLowerCase()) {
                    signed = true;
                    break;
                  }
                }
                // Organizational CLA: "Name (github-username)"
                const match = line.match(/\(([^)]+)\)\s*$/);
                if (match && match[1].toLowerCase() === author.toLowerCase()) {
                  signed = true;
                  break;
                }
              }
            } catch (e) {
              console.log('CLA_SIGNATURES file not found.');
            }

            if (!signed) {
              const body = `### CLA Required

            Thank you for your contribution! Before we can merge this pull request, you need to sign the [Contributor License Agreement](https://github.com/symfluence-org/SYMFLUENCE/blob/main/CLA.md).

            **How to sign:**
            1. Read the [CLA](https://github.com/symfluence-org/SYMFLUENCE/blob/main/CLA.md)
            2. Add your information to the \`CLA_SIGNATURES\` file via a separate PR
            3. Once merged, this check will pass automatically on your next push

            This is required for all external contributors to ensure SYMFLUENCE can be properly licensed.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: body
              });

              core.setFailed(`${author} has not signed the CLA.`);
            } else {
              console.log(`${author} has signed the CLA.`);
            }
