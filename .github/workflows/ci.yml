name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version synchronization
        run: |
          chmod +x scripts/check_version_sync.sh
          ./scripts/check_version_sync.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install minimal deps for linting
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml

      - name: Lint with ruff
        run: |
          # Lint only src and tests, exclude examples (notebooks can be informal)
          ruff check src/ tests/

      - name: Guard broad Exception catches
        run: |
          python scripts/check_broad_exceptions.py

      - name: Guard resilience handlers log with a traceback
        run: |
          python scripts/check_resilience_logging.py

      - name: Guard generic raises in models/
        run: |
          python scripts/check_model_raises.py

      - name: Guard install-manifest consistency
        run: |
          python scripts/check_manifest_consistency.py

      - name: Type check with mypy
        continue-on-error: false
        run: |
          # Install type stubs
          pip install mypy pandas-stubs types-PyYAML types-requests types-psutil
          # Run mypy on source directory
          mypy src/symfluence

  # Fast unit-test gate (ubuntu/3.11). The full OS matrix lives in
  # cross-platform.yml (develop/nightly/release); this keeps PRs quick while
  # still gating on tests + coverage.
  unit-tests:
    name: Unit Tests (ubuntu, Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev cdo

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if command -v gdal-config >/dev/null 2>&1; then
            GDAL_VERSION=$(gdal-config --version)
            pip install "gdal>=${GDAL_VERSION},<${GDAL_VERSION%.*}.$((${GDAL_VERSION##*.}+1))"
          fi
          # CPU-only torch to save space/time
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Package + test extras (pytest, pytest-xdist, hypothesis, jax/llm) from pyproject
          # gui+baseflow extras so the optional-feature unit tests run here
          # instead of skipping (panel-based GUI, baseflow hydrology signatures).
          pip install -e ".[test,gui,baseflow]"

      - name: Run unit tests with coverage
        run: |
          pytest -v --tb=short -m "unit" -n auto \
            --cov --cov-report=term-missing --cov-fail-under=25 tests/unit/

      - name: Core coverage gate
        # The global floor (25%) blends in model-binary/live-API code that can't
        # run in CI. The core spine (config parsing, registry, path resolution,
        # mixins) IS fully testable, so it gets its own stricter ratchet, reusing
        # the .coverage data from the step above. Instrumentation-only modules
        # (profiling, npm packaging) are excluded, mirroring the gui/tui/fews omit.
        # One-way ratchet: raise as coverage improves, never lower.
        run: |
          coverage report \
            --include='src/symfluence/core/*' \
            --omit='src/symfluence/core/profiling/*,src/symfluence/core/npm_bundle.py' \
            --fail-under=80

      - name: Package import smoke test
        run: |
          python -c "import symfluence; from symfluence.core.registries import R; \
            assert R.runners.get('SUMMA') is not None, 'SUMMA not registered via entry points'; \
            print('import + entry-point registration OK')"
