name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate version synchronization
        run: |
          chmod +x scripts/check_version_sync.sh
          ./scripts/check_version_sync.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install minimal deps for linting
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml actionlint-py==1.7.12.24 uv==0.10.4

      - name: Validate GitHub Actions workflows
        run: python scripts/run_actionlint.py

      - name: Guard CI dependency and cache policy
        run: python scripts/check_ci_dependency_policy.py

      - name: Validate universal dependency lock
        run: uv lock --check

      - name: Audit locked runtime dependencies
        run: |
          uv export --quiet --locked --no-dev --no-emit-project \
            --output-file /tmp/symfluence-runtime.txt
          uvx pip-audit -r /tmp/symfluence-runtime.txt --no-deps

      - name: Lint with ruff
        run: |
          # Lint only src and tests, exclude examples (notebooks can be informal)
          ruff check src/ tests/

      - name: Guard broad Exception catches
        run: |
          python scripts/check_broad_exceptions.py

      - name: Guard resilience handlers log with a traceback
        run: |
          python scripts/check_resilience_logging.py

      - name: Guard generic raises in models/
        run: |
          python scripts/check_model_raises.py

      - name: Guard install-manifest consistency
        run: |
          python scripts/check_manifest_consistency.py

      - name: Guard core layering (no core -> upper-layer imports)
        run: |
          python scripts/check_core_layering.py

      # NOTE: the shipped-config strict guard (scripts/check_shipped_configs_strict.py)
      # needs the installed symfluence package to build the recognized-key set, so it
      # is NOT run here (the lint job installs only ruff+pyyaml). It is enforced in the
      # Unit Tests job via tests/unit/config/test_shipped_configs_strict.py, and in
      # pre-commit (language: system).

      - name: Type check with mypy
        continue-on-error: false
        run: |
          # Pinned to match the pre-commit mirrors-mypy hook — the two gates
          # must run the same toolchain or casts valid under one stub version
          # fail the other. Bump both together.
          pip install mypy==2.3.0 pandas-stubs==3.0.3.260530 types-PyYAML types-requests types-psutil
          # Run mypy on source directory
          mypy src/symfluence

  # Fast unit-test gate (ubuntu). The full OS matrix lives in
  # cross-platform.yml (develop/nightly/release); this keeps PRs quick while
  # still gating on tests + coverage.
  #
  # The interpreter matrix is here rather than in cross-platform.yml because a
  # version-specific break must fail the PR, not develop: three tests faking
  # sys.platform='win32' sat broken on 3.12 for as long as CI only ran 3.11,
  # because stdlib shutil.which grew a _winapi call on that branch in 3.12.
  # The legs run in parallel, so covering the declared range costs runner
  # minutes, not wall-clock. These legs ARE the evidence behind
  # requires-python = ">=3.11,<3.14"; keep the two in step, and treat a leg that
  # cannot be made green as a reason to narrow the declared range rather than to
  # drop the leg.
  unit-tests:
    name: Unit Tests (ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    # The `-m "unit" -n auto` suite runs right up against 20 min on slower
    # runners (intermittent timeout-cancellations); 30 gives headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          version: "0.10.4"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev cdo

      - name: Install Python dependencies
        run: |
          uv sync --locked --extra test --extra gui
          # On x86_64 Linux, h5py 3.15 and netCDF4 wheels both bundle HDF5
          # 1.14 with unversioned globals. Loading both corrupts dimension-scale
          # state. h5py 3.16 bundles HDF5 2.0, keeping the private symbols
          # isolated. ARM wheels require the opposite pin; this matrix is x64.
          uv pip install --reinstall --only-binary :all: 'h5py>=3.16' netCDF4
          if command -v gdal-config >/dev/null 2>&1; then
            GDAL_VERSION=$(gdal-config --version)
            uv pip install "gdal>=${GDAL_VERSION},<${GDAL_VERSION%.*}.$((${GDAL_VERSION##*.}+1))"
          fi

      - name: Preflight runtime storage backends
        run: uv run --no-sync python scripts/check_runtime_backends.py

      - name: Run unit tests with coverage
        run: |
          # --no-sync preserves the system-matched GDAL binding installed above.
          uv run --no-sync pytest --timeout=300 -v --tb=short -m "unit" -n auto \
            --cov --cov-report=term-missing --cov-fail-under=25 tests/unit/

      - name: Core coverage gate
        # Single shared definition (scope, omits, threshold rationale) lives in
        # scripts/check_core_coverage.py — never inline this command; the
        # duplicated copies in ci.yml and cross-platform.yml once drifted.
        # Coverage is a property of the codebase, not of the interpreter, so it
        # is gated once rather than per matrix leg.
        if: matrix.python-version == '3.11'
        run: uv run --no-sync python scripts/check_core_coverage.py

      - name: Package import smoke test
        run: |
          uv run --no-sync python -c "import symfluence; from symfluence.core.registries import R; \
            assert R.runners.get('SUMMA') is not None, 'SUMMA not registered via entry points'; \
            print('import + entry-point registration OK')"

      - name: Optional-extra hygiene (core runs without community packages)
        # This job installs no community extras, so it proves the community
        # data packages are genuinely optional: absent from the import graph,
        # yet the acquisition-backend seam still imports and resolves to the
        # native backend. Guards against a community package becoming a hidden
        # hard dependency. See docs/community_services_full_coverage_plan.md.
        run: |
          uv run --no-sync python -c "import importlib.util; \
            absent = [p for p in ('cfs', 'cas', 'csfs', 'cos') if importlib.util.find_spec(p) is None]; \
            assert absent == ['cfs', 'cas', 'csfs', 'cos'], f'community package unexpectedly installed: {sorted(set([\"cfs\",\"cas\",\"csfs\",\"cos\"]) - set(absent))}'; \
            from symfluence.data.backends.selection import select_backend; \
            from symfluence.core.registries import R; \
            assert R.acquisition_backends.get('native') is not None, 'native backend must exist without any community package'; \
            print('optional-extra hygiene OK: core runs, native backend present, no community package required')"

      - name: CLI performance regression tests
        # Lazy-import guard: fails if a heavy dependency creeps into CLI
        # startup. Serial (-n 0) so subprocess wall-clock timings are stable —
        # and on one leg only, so a second interpreter's startup characteristics
        # cannot turn a wall-clock threshold into a coin flip.
        if: matrix.python-version == '3.11'
        run: |
          uv run --no-sync pytest --timeout=300 -m performance -n 0 tests/performance/

  # Build and install the wheel in a fresh environment so built-in backends
  # cannot rely on editable-install paths or undeclared transitive dependencies.
  runtime-backend-contract:
    name: Runtime Backend Contract (wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/symfluence-wheel-contract
          /tmp/symfluence-wheel-contract/bin/python -m pip install --upgrade pip
          WHEEL=$(find dist -name 'symfluence-*.whl' -print -quit)
          /tmp/symfluence-wheel-contract/bin/python -m pip install "${WHEEL}"
          # Match the proven x86_64 wheel-isolation policy used by unit CI.
          /tmp/symfluence-wheel-contract/bin/python -m pip install \
            --force-reinstall --only-binary :all: 'h5py>=3.16' netCDF4

      - name: Validate installed runtime backends
        run: |
          cd /tmp
          /tmp/symfluence-wheel-contract/bin/python \
            "$GITHUB_WORKSPACE/scripts/check_runtime_backends.py" \
            --require-installed-wheel
