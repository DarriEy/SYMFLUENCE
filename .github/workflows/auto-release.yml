name: Auto Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    name: Verify release branch
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.verify.outputs.allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify release branch
        id: verify
        uses: ./.github/actions/verify-release-branch

  release:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
