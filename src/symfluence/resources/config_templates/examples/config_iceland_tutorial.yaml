# ============================================================================
# SYMFLUENCE Configuration: Iceland Regional Modeling Tutorial
# ============================================================================
#
# This configuration demonstrates regional-scale modeling capabilities:
# - Multi-basin delineation across Iceland
# - CARRA Arctic reanalysis forcing data
# - Semi-distributed HRU discretization by elevation
# - Coastal watershed handling for islands
#
# Domain: Iceland (~103,000 km²)
# Period: 2011-2022 (calibration: 2013-2016, validation: 2017-2022)
#
# Key Features Demonstrated:
# - DELINEATE_COASTAL_WATERSHEDS for handling island hydrology
# - Regional reanalysis (CARRA) for high-latitude domains
# - Elevation-based HRU discretization (400m bands)
#
# ============================================================================

